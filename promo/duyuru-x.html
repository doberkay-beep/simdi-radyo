<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Bricolage"; src: url("file:///root/.claude/skills/synced/canvas-design/canvas-fonts/BricolageGrotesque-Bold.ttf"); font-weight: 700; }
  @font-face { font-family: "Lora"; src: url("file:///root/.claude/skills/synced/canvas-design/canvas-fonts/Lora-Italic.ttf"); font-style: italic; }
  @font-face { font-family: "JBMono"; src: url("file:///root/.claude/skills/synced/canvas-design/canvas-fonts/JetBrainsMono-Regular.ttf"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 675px; }
  body {
    background: #0a0a0b; color: #ececee; position: relative; overflow: hidden;
    padding: 62px 72px; display: flex; align-items: stretch; gap: 56px;
  }
  .glow {
    position: absolute; right: 16%; top: 58%; width: 620px; height: 620px;
    transform: translate(50%, -50%);
    background: radial-gradient(circle, rgba(255,150,80,0.10) 0%, rgba(255,150,80,0) 62%);
  }
  .left { flex: 1; display: flex; flex-direction: column; padding-bottom: 8px; }
  .kicker { font-family:"JBMono",monospace; font-size:17px; letter-spacing:6px; color:#ffb257; text-transform:uppercase; }
  .wordmark { font-family:"Bricolage",sans-serif; font-weight:700; font-size:190px; line-height:0.9; letter-spacing:-5px; color:#f4f3f1; margin-top:14px; }
  .tagline { font-family:"Lora",serif; font-style:italic; font-size:34px; color:#b9b9c0; margin-top:26px; }
  .spacer { flex: 1; }
  .poem { font-family:"Lora",serif; font-style:italic; font-size:32px; line-height:1.3; color:#dedee2; }
  .poem .soft { color:#8a8a92; }
  .right { width: 300px; position: relative; display: flex; align-items: flex-end; justify-content: center; gap: 16px; padding-bottom: 64px; }
  .bar { width: 34px; border-radius: 17px; }
  .lines { position:absolute; left:0; bottom:30px; width:100%; display:flex; flex-direction:column; gap:11px; }
  .ln { height:3px; background:rgba(236,236,238,0.11); border-radius:2px; }
  .footwrap { margin-top: 30px; }
  .footrule { height:1px; width:150px; background:rgba(236,236,238,0.16); margin-bottom:18px; }
  .foot { font-family:"JBMono",monospace; font-size:19px; letter-spacing:2px; color:#9a9aa2; }
  .url { color:#f4f3f1; letter-spacing:3px; }
  .toprighttag { position:absolute; right:72px; top:62px; font-family:"JBMono",monospace; font-size:17px; letter-spacing:3px; color:#8a8a92; text-transform:uppercase; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="toprighttag">Türkiye · Canlı</div>

  <div class="left">
    <div class="kicker">Canlı Radyo</div>
    <div class="wordmark">ŞİMDİ</div>
    <div class="tagline">radyoda şu an ne çalıyor</div>
    <div class="poem" style="margin-top:96px">Önce kelimeler. <span class="soft">Şimdi frekanslar.</span></div>
    <div class="footwrap">
      <div class="footrule"></div>
      <div class="foot"><span class="url">necaliyor.co</span> &nbsp;·&nbsp; bir yazarın radyo girişimi</div>
    </div>
  </div>

  <div class="right">
    <div class="bar" style="height:120px; background:linear-gradient(#ff8a5b,#ff9a58)"></div>
    <div class="bar" style="height:210px; background:linear-gradient(#ff9a58,#ffab54)"></div>
    <div class="bar" style="height:300px; background:linear-gradient(#ffab54,#ffbe50)"></div>
    <div class="bar" style="height:165px; background:linear-gradient(#ffbe50,#ffc94e)"></div>
    <div class="bar" style="height:250px; background:linear-gradient(#ffc94e,#ffd24d)"></div>
    <div class="lines">
      <div class="ln" style="width:100%"></div>
      <div class="ln" style="width:90%"></div>
      <div class="ln" style="width:96%"></div>
      <div class="ln" style="width:68%"></div>
    </div>
  </div>

</body>
</html>
