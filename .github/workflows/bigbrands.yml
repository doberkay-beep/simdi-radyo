name: Büyük TR markaları

# Kral FM, PowerTürk, Radyo D, Number1, Best FM, Show Radyo gibi en çok aranan
# büyük markaların RESMİ CDN adres kalıplarını dener, ICY ile doğrular, çalışanı
# "CAND {...}" yazar. Actions → "Büyük TR markaları" → Run workflow.

on:
  workflow_dispatch: {}

jobs:
  bigbrands:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Adayları yokla
        run: node probe/bigbrands.mjs
