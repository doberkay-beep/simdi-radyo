name: Katalog denetimi

# collector/seed.json'daki her istasyonu yoklar, ölü/sessiz olanları loglar.
# Ölü çıkanları katalogdan çıkarırız. Elle tetiklenir.

on:
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Denetle
        run: node probe/audit.mjs
