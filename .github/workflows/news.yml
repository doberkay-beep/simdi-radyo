name: Haber radyoları

# Küratörlü haber/talk istasyonlarını (TR + yabancı-İngilizce) radio-browser'da
# arar, ICY ile yoklar, çalışan + katalogda olmayanları "CAND {...}" yazar.
# Actions → "Haber radyoları" → Run workflow.

on:
  workflow_dispatch: {}

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ara ve yokla
        run: node probe/news.mjs
