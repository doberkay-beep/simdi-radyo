name: Toplayıcı (arşiv)

# EMEKLİ (30 Eyl 2026): toplayıcı artık Hetzner CX23'te 7/24 çalışıyor
# (188.245.2.113, systemd: simdi-collector, 25 sn aralık). GitHub cron'u
# pratikte 4-6 saatte bir tetiklendiği için arşiv delik deşikti.
# Bu workflow YEDEK olarak durur: sunucu çökerse Actions sekmesinden
# elle tetiklenebilir (Run workflow).

on:
  workflow_dispatch: {} # yalnız elle — zamanlama kaldırıldı (sunucu asıl)

# Aynı anda tek çalışma; yeni tetikleme öncekini iptal edip taze başlar.
concurrency:
  group: collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # Supabase istemcisi Node 22+ ister (native WebSocket)
      - name: Bağımlılıklar
        working-directory: collector
        run: npm install --no-audit --no-fund
      - name: Yokla ve arşivle
        working-directory: collector
        env:
          # URL herkese açık; secret anahtar GitHub Secrets'tan gelir.
          SUPABASE_URL: https://uiouzizblrkojmsqvbjk.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUN_DURATION_MS: "280000" # ~4 dk 40 sn çalış, sonra çık
        run: node src/worker.mjs
