name: Yabancı radyolar

# Küratörlü yabancı istasyon listesini radio-browser'da arar, ICY ile yoklar,
# çalışan + katalogda olmayanları loglara "CAND {...}" olarak yazar.
# Actions → "Yabancı radyolar" → Run workflow.

on:
  workflow_dispatch: {}

jobs:
  foreign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ara ve yokla
        run: node probe/foreign.mjs
